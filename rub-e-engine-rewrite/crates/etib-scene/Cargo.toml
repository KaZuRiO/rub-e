[package]
name = "etib-scene"
version.workspace = true
edition.workspace = true
description = "Cube scenes for etib: a camera, static and dynamic cube models, GPU frustum culling and an HDR skybox"

[dependencies]
bytemuck = { workspace = true, features = ["derive"] }
etib-core = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
# The example opens a window, which this crate deliberately knows nothing
# about; the framework does that part, and only for the example.
etib = { path = "../etib", default-features = false }
env_logger = { workspace = true }

[[example]]
name = "hello"
path = "examples/hello/main.rs"
