[package]
name = "etib-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A thin, wgpu-free abstraction over the GPU operations the etib framework needs"

[features]
# Exposes `test_util`, a windowless device for other crates' tests.
test-util = []

[dependencies]
bytemuck = { workspace = true, features = ["derive"] }
log = { workspace = true }
pollster = { workspace = true }
wgpu = { workspace = true }

[lints]
workspace = true
