[package]
name = "etib-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Keyboard, mouse and gamepad state for etib applications, fed from winit events"

[features]
# Gamepads, through gilrs. Off, nothing gamepad-related is compiled or linked;
# on Linux it needs libudev.
gamepad = ["dep:gilrs"]

[dependencies]
gilrs = { workspace = true, optional = true }
glam = { workspace = true }
log = { workspace = true }
winit = { workspace = true }

[lints]
workspace = true
